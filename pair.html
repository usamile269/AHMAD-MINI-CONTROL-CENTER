<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>™ 𝑨𝑯𝑴𝑨𝑫 𝑴𝑰𝑵𝑰 ᥫᩣ — Pair Device</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff007f;
            --obsidian: #050505;
            --glass: rgba(15, 15, 15, 0.85);
            --border: rgba(255, 0, 127, 0.25);
        }
        body {
            background: var(--obsidian);
            color: #e0e0e0;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }
        .luxury-font { font-family: 'Orbitron', sans-serif; }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
        }
        .neon-text { text-shadow: 0 0 15px var(--neon-pink); }
        .neon-border-glow:focus { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        
        .bg-grid {
            background-image: linear-gradient(rgba(255, 0, 127, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 0, 127, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
        }

        .btn-luxe {
            background: linear-gradient(45deg, #ff007f, #800040);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            transition: 0.4s;
        }
        .btn-luxe:hover { box-shadow: 0 0 25px var(--neon-pink); transform: translateY(-2px); }
        
        .logo-ring {
            width: 150px; height: 150px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            display: flex; align-items: center; justify-content: center;
            position: relative;
            animation: ringPulse 3s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.3);
            background-size: cover; background-position: center;
        }
        @keyframes ringPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 127, 0.2); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 127, 0.5); }
        }

        #hero-video {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: -3; opacity: 0.3;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    <video id="hero-video" autoplay loop muted playsinline></video>
    <div class="bg-grid"></div>

    <div class="brand-section text-center mb-10">
        <div class="logo-ring mx-auto mb-6" id="bot-logo">
            <span class="luxury-font text-5xl neon-text" id="bot-initial">A</span>
        </div>
        <h1 class="luxury-font text-4xl text-white neon-text mb-2" id="display-name">𝑨𝑯𝑴𝑨𝑫 𝑴𝑰𝑵𝑰</h1>
        <p class="text-pink-500 tracking-[5px] text-xs uppercase font-bold" id="hero-tagline">Obsidian Luxe Edition</p>
    </div>

    <div class="glass-card p-10 rounded-3xl w-full max-w-lg text-center relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-pink-600 to-transparent"></div>
        
        <h2 class="luxury-font text-xl mb-8">WHATSAPP PAIRING</h2>
        
        <div id="input-section" class="space-y-6">
            <div class="relative">
                <input type="tel" id="number" placeholder="923044975027" class="w-full bg-black/40 border border-pink-900/30 rounded-xl py-4 px-6 text-center text-xl tracking-widest text-white neon-border-glow">
                <p class="text-[10px] text-gray-500 mt-2 uppercase tracking-widest">Enter number with country code (e.g. 92...)</p>
            </div>
            <button id="getCodeBtn" onclick="getPairingCode()" class="btn-luxe w-full py-4 rounded-xl text-lg shadow-2xl">⚡ INITIATE PAIRING</button>
        </div>

        <div id="code-section" class="hidden space-y-8 animate-pulse">
            <div class="bg-black/60 border-2 border-dashed border-pink-600 rounded-2xl py-8">
                <p id="pairing-code" class="luxury-font text-5xl tracking-[15px] text-pink-500 neon-text">LOADING</p>
            </div>
            <div class="text-left space-y-4 text-sm text-gray-400">
                <p class="flex items-center"><span class="w-6 h-6 bg-pink-600 rounded-full text-white flex items-center justify-center mr-3 text-xs">1</span> Open WhatsApp Settings</p>
                <p class="flex items-center"><span class="w-6 h-6 bg-pink-600 rounded-full text-white flex items-center justify-center mr-3 text-xs">2</span> Tap Linked Devices</p>
                <p class="flex items-center"><span class="w-6 h-6 bg-pink-600 rounded-full text-white flex items-center justify-center mr-3 text-xs">3</span> Enter the code above</p>
            </div>
            <button onclick="resetPairing()" class="text-xs text-pink-500 hover:text-white uppercase tracking-widest">Try another number</button>
        </div>
    </div>

    <footer class="mt-12 text-center">
        <div class="flex justify-center gap-8 mb-6">
            <a id="channel-link" href="#" target="_blank" class="text-gray-500 hover:text-pink-500 transition text-2xl">📢</a>
            <a id="yt-link" href="#" target="_blank" class="text-gray-500 hover:text-red-500 transition text-2xl">📺</a>
            <a id="github-link" href="#" target="_blank" class="text-gray-500 hover:text-white transition text-2xl">💻</a>
        </div>
        <p class="text-[10px] text-gray-600 tracking-[3px] uppercase" id="footer-text">✦﹒𝙊𝘽𝙎𝙄𝘿𝙄𝘼𝙉 𝙇𝙐𝙓𝙀 𝘼𝙃𝙈𝘼𝘿 𝙈𝙄𝙉𝙄</p>
    </footer>

    <script>
        async function loadSettings() {
            const res = await fetch('/admin/site-settings?key=ahmadluxe123'); // Public fetch
            const data = await res.json();
            if (data.success) {
                const s = data.settings;
                document.getElementById('display-name').innerText = s.botName || '𝑨𝑯𝑴𝑨𝑫 𝑴𝑰𝑵𝑰';
                document.getElementById('bot-initial').innerText = (s.botName || 'A').charAt(0);
                document.getElementById('hero-tagline').innerText = s.heroTagline || 'Obsidian Luxe Edition';
                document.getElementById('footer-text').innerText = s.footer || '✦﹒𝙊𝘽𝙎𝙄𝘿𝙄𝘼𝙉 𝙇𝙐𝙓𝙀 𝘼𝙃𝙈𝘼𝘿 𝙈𝙄𝙉𝙄';
                
                if (s.botImageUrl) {
                    document.getElementById('bot-logo').style.backgroundImage = `url(${s.botImageUrl})`;
                    document.getElementById('bot-initial').style.display = 'none';
                }
                
                if (s.heroVideo) {
                    document.getElementById('hero-video').src = s.heroVideo;
                }
                
                document.getElementById('channel-link').href = s.channelLink || '#';
                document.getElementById('yt-link').href = s.youtubeLink || '#';
                document.getElementById('github-link').href = s.githubLink || '#';
            }
        }

        async function getPairingCode() {
            const num = document.getElementById('number').value.replace(/[^0-9]/g, '');
            if (!num) return alert('Enter a valid number!');
            
            document.getElementById('getCodeBtn').innerText = '🚀 SYNCHRONIZING...';
            
            try {
                const res = await fetch(`/code?number=${num}`);
                const data = await res.json();
                if (data.code) {
                    document.getElementById('pairing-code').innerText = data.code;
                    document.getElementById('input-section').classList.add('hidden');
                    document.getElementById('code-section').classList.remove('hidden');
                } else {
                    alert('Error: ' + (data.error || 'Failed to get code'));
                    document.getElementById('getCodeBtn').innerText = '⚡ INITIATE PAIRING';
                }
            } catch (e) {
                alert('Connection Error!');
                document.getElementById('getCodeBtn').innerText = '⚡ INITIATE PAIRING';
            }
        }

        function resetPairing() {
            document.getElementById('input-section').classList.remove('hidden');
            document.getElementById('code-section').classList.add('hidden');
            document.getElementById('getCodeBtn').innerText = '⚡ INITIATE PAIRING';
        }

        loadSettings();
    </script>
</body>
</html>
