<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBSIDIAN LUXE | CONTROL CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff007f;
            --obsidian: #0a0a0a;
            --glass: rgba(20, 20, 20, 0.7);
        }
        body {
            background: var(--obsidian);
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
        }
        .luxury-font { font-family: 'Orbitron', sans-serif; }
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 127, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }
        .neon-glow {
            box-shadow: 0 0 15px var(--neon-pink);
        }
        .neon-text {
            text-shadow: 0 0 10px var(--neon-pink);
        }
        .bg-animate {
            background: radial-gradient(circle at 50% 50%, #1a000a 0%, #0a0a0a 100%);
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }
        .neon-circle {
            position: absolute;
            width: 300px; height: 300px;
            background: var(--neon-pink);
            filter: blur(150px);
            opacity: 0.15;
            border-radius: 50%;
            animation: move 20s infinite alternate;
        }
        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(110%, 110%); }
        }
        input, select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 127, 0.3);
            color: white;
            padding: 10px;
            border-radius: 5px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--neon-pink); box-shadow: 0 0 10px rgba(255, 0, 127, 0.5); }
        .btn-luxe {
            background: linear-gradient(45deg, #ff007f, #800040);
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        .btn-luxe:hover { transform: scale(1.05); box-shadow: 0 0 20px var(--neon-pink); }
    </style>
</head>
<body>
    <div class="bg-animate"></div>
    <div class="neon-circle"></div>
    
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center">
        <div class="glass-card p-10 rounded-2xl w-full max-w-md text-center">
            <h1 class="luxury-font text-3xl mb-6 neon-text">🛡️ ACCESS LOCKED</h1>
            <p class="text-gray-400 mb-8 italic">Enter Master Key to control Obsidian Luxe</p>
            <input type="password" id="admin-pass" placeholder="MASTER KEY" class="w-full mb-6 text-center text-xl tracking-widest">
            <button onclick="login()" class="btn-luxe w-full py-3 rounded-lg">INITIALIZE SYSTEM</button>
            <p id="login-error" class="text-red-500 mt-4 hidden">❌ Invalid Access Key</p>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboard" class="hidden min-h-screen p-6 lg:p-12">
        <header class="flex justify-between items-center mb-12 border-b border-pink-900/30 pb-6">
            <div>
                <h1 class="luxury-font text-4xl neon-text">𝙊𝘽𝙎𝙄𝘿𝙄𝘼𝙉 𝙇𝙐𝙓𝙀</h1>
                <p class="text-pink-500 tracking-[5px] text-sm uppercase">Control Center v3.0</p>
            </div>
            <button onclick="logout()" class="text-gray-500 hover:text-white transition">DISCONNECT</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Stats Column -->
            <div class="lg:col-span-1 space-y-8">
                <div class="glass-card p-6 rounded-xl">
                    <h2 class="luxury-font text-xl mb-4 flex items-center">📊 SYSTEM STATUS</h2>
                    <div class="space-y-4">
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <span class="text-gray-400">Connection</span>
                            <span id="status-conn" class="text-green-500 font-bold">ONLINE</span>
                        </div>
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <span class="text-gray-400">Active Sessions</span>
                            <span id="status-sessions" class="text-pink-500">0</span>
                        </div>
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <span class="text-gray-400">RAM Usage</span>
                            <span id="status-ram" class="text-blue-400">0 MB</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-400">Uptime</span>
                            <span id="status-uptime" class="text-yellow-500">0h 0m</span>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-xl">
                    <h2 class="luxury-font text-xl mb-4 flex items-center">📢 CHANNEL WHITELIST</h2>
                    <div id="channel-list" class="space-y-3 mb-6 max-h-60 overflow-y-auto">
                        <!-- Channels will load here -->
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="new-jid" placeholder="JID (e.g. 123@newsletter)" class="flex-1 text-sm">
                        <button onclick="addChannel()" class="btn-luxe px-4 rounded text-sm">+</button>
                    </div>
                </div>
            </div>

            <!-- Settings Column -->
            <div class="lg:col-span-2 space-y-8">
                <div class="glass-card p-8 rounded-xl">
                    <h2 class="luxury-font text-2xl mb-8 border-l-4 border-pink-600 pl-4">⚙️ GLOBAL CONFIGURATION</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Bot Display Name</label>
                            <input type="text" id="cfg-bot-name">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Command Prefix</label>
                            <input type="text" id="cfg-prefix">
                        </div>
                        <div class="flex flex-col md:col-span-2">
                            <label class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Global Footer</label>
                            <input type="text" id="cfg-footer">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Auto View Status</label>
                            <select id="cfg-auto-view">
                                <option value="true">ENABLED</option>
                                <option value="false">DISABLED</option>
                            </select>
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Auto Like Status</label>
                            <select id="cfg-auto-like">
                                <option value="true">ENABLED</option>
                                <option value="false">DISABLED</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-8 rounded-xl">
                    <h2 class="luxury-font text-2xl mb-8 border-l-4 border-blue-600 pl-4">🎬 MEDIA HUB</h2>
                    <div class="space-y-6">
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Welcome Video URL (WhatsApp PTV)</label>
                            <input type="text" id="cfg-welcome-video">
                        </div>
                        <div class="flex flex-col">
                            <label class="text-xs text-gray-500 mb-1 uppercase tracking-wider">Hero Section Video URL (Web)</label>
                            <input type="text" id="cfg-hero-video">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-4">
                    <button onclick="resetToDefault()" class="px-8 py-3 border border-white/10 rounded-lg hover:bg-white/5 transition">RESET ALL</button>
                    <button onclick="saveAllSettings()" class="btn-luxe px-12 py-3 rounded-lg neon-glow">SAVE CHANGES</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let masterKey = '';

        async function login() {
            const pass = document.getElementById('admin-pass').value;
            const res = await fetch('/admin/verify-key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: pass })
            });
            const data = await res.json();
            if (data.success) {
                masterKey = pass;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadDashboard();
                setInterval(loadStats, 5000);
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function logout() {
            location.reload();
        }

        async function loadDashboard() {
            const res = await fetch(`/admin/site-settings?key=${masterKey}`);
            const data = await res.json();
            if (data.success) {
                const s = data.settings;
                document.getElementById('cfg-bot-name').value = s.botName || 'AHMAD MINI';
                document.getElementById('cfg-prefix').value = s.prefix || '.';
                document.getElementById('cfg-footer').value = s.footer || '';
                document.getElementById('cfg-auto-view').value = s.autoViewStatus || 'true';
                document.getElementById('cfg-auto-like').value = s.autoLikeStatus || 'true';
                document.getElementById('cfg-welcome-video').value = s.welcomeVideo || '';
                document.getElementById('cfg-hero-video').value = s.heroVideo || '';
                
                renderChannels(s.whitelist || []);
            }
            loadStats();
        }

        async function loadStats() {
            const res = await fetch(`/admin/stats?key=${masterKey}`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('status-sessions').innerText = data.stats.activeSessions;
                document.getElementById('status-ram').innerText = data.stats.ram;
                document.getElementById('status-uptime').innerText = data.stats.uptime;
            }
        }

        function renderChannels(list) {
            const container = document.getElementById('channel-list');
            container.innerHTML = list.map((jid, i) => `
                <div class="flex justify-between items-center bg-white/5 p-2 rounded border border-white/10">
                    <span class="text-xs truncate max-w-[200px]">${jid}</span>
                    <button onclick="removeChannel('${jid}')" class="text-red-500 hover:text-red-400 text-xs">REMOVE</button>
                </div>
            `).join('') || '<p class="text-gray-600 text-center py-4">No channels whitelisted</p>';
        }

        async function addChannel() {
            const jid = document.getElementById('new-jid').value.trim();
            if (!jid) return;
            const res = await fetch('/admin/whitelist/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: masterKey, jid })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('new-jid').value = '';
                loadDashboard();
            }
        }

        async function removeChannel(jid) {
            const res = await fetch('/admin/whitelist/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: masterKey, jid })
            });
            const data = await res.json();
            if (data.success) loadDashboard();
        }

        async function saveAllSettings() {
            const settings = {
                botName: document.getElementById('cfg-bot-name').value,
                prefix: document.getElementById('cfg-prefix').value,
                footer: document.getElementById('cfg-footer').value,
                autoViewStatus: document.getElementById('cfg-auto-view').value,
                autoLikeStatus: document.getElementById('cfg-auto-like').value,
                welcomeVideo: document.getElementById('cfg-welcome-video').value,
                heroVideo: document.getElementById('cfg-hero-video').value
            };
            const res = await fetch('/admin/site-settings/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key: masterKey, settings })
            });
            const data = await res.json();
            if (data.success) alert('✅ SYSTEM UPDATED SUCCESSFULLY');
        }

        async function resetToDefault() {
            if (confirm('Are you sure you want to reset all settings?')) {
                // Reset logic here
            }
        }
    </script>
</body>
</html>
